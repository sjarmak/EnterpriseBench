# Refactor Orchestration: JS compilation pipeline refactoring across Babel/webpack/Next.js

difficulty_stratum = "tri_repo"
mcp_suite = "eb_v1"
repo_set_id = "js-build-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "refactor-orchestration-tri-babel-001"
suite = "technical_debt"
task_type = "refactor_orchestration"
difficulty = "hard"
estimated_duration_minutes = 35
session_type = "single"
description = "Plan refactoring JS compilation pipeline when Babel parser AST changes propagate through webpack's babel-loader to Next.js build"
# NEVER SHOWN TO THE AGENT. run_task.py feeds instruction.md
# (`agent_command < /workspace/instruction.md`); this field is stale
# CSB-migration metadata. Re-synced anyway: its previous text stated
# "The dependency chain is: babel -> webpack -> next.js" and asserted updates to
# "webpack's babel-loader" and "webpack's tree-shaking to understand decorator
# side effects" -- both the giveaway this rebuild removed and false at the pinned
# revs (webpack v5.88.2 parses with acorn ^8.7.1 and declares no babel
# dependency; babel-loader is a separate repo that is not vendored here). Left as
# it was, a future regeneration of instruction.md from this field would restore
# the leak and the false premise together.
prompt = """
As tech lead for a frontend platform team, you need to plan the rollout of a
breaking change in the JavaScript compilation pipeline. Babel is refactoring its
parser to produce a new DecoratorMetadata AST node (stage 3 decorators).
Anything that parses JavaScript with Babel, or walks a Babel AST, may have to
handle the new node type.

We vendor three repos at /workspace/babel/, /workspace/webpack/ and
/workspace/nextjs/. Do not assume how they relate to each other, or which of them
a Babel parser change actually reaches. Work out from the manifests which repos
consume Babel, and cite the dependency entry that establishes each edge.

Your task is to produce a topologically sorted execution plan:

1. Identify the repos the change actually reaches, and in what order.
2. Map the dependency relationships between repos, citing the manifest entry
   behind each edge. If a repo you expected to be affected turns out not to be,
   say so and show what its manifest actually declares.
3. Produce a numbered, ordered list of repos to update.
4. Identify any steps that can be done in parallel, and why.
5. Note which changes are breaking vs. compatible.

Write your plan to /workspace/REFACTOR_PLAN.md with:
- Numbered ordering of repos to update
- Dependency graph explanation
- Parallelization annotations
- Risk assessment and breaking change annotations
"""

[[repos]]
url = "https://github.com/babel/babel"
rev = "v7.22.9"
path = "babel"
role = "upstream"

[[repos]]
url = "https://github.com/webpack/webpack"
rev = "v5.88.2"
path = "webpack"
role = "intermediary"

[[repos]]
url = "https://github.com/vercel/next.js"
rev = "v13.4.12"
path = "nextjs"
role = "consumer"

[metadata]
languages = ["javascript"]
total_loc = 2200000
dependency_depth = 3
frameworks = ["babel", "webpack", "nextjs"]
multi_repo_pattern = "orchestrate"

# Weights unchanged; every checkpoint re-scoped onto manifest-derived evidence.
# All three previously graded vocabulary instruction.md supplied, so a plan that
# restated the prompt scored a perfect 1.0000 with zero repo access while an
# empty file banked 0.15 on check_parallelism's "did not explicitly address"
# branch. See each check header and ground_truth.json:_premise_correction — the
# babel -> webpack -> next.js chain the task asserted is false at BOTH edges:
# webpack v5.88.2 parses with acorn ^8.7.1 and declares no babel dependency.
[[checkpoints]]
name = "identify_repos"
weight = 0.25
verifier = "checks/check_repo_set.sh"
description = "Agent identifies the repos the Babel parser change actually reaches (babel, next.js) and cites what webpack parses with instead"
timeout_seconds = 30

[[checkpoints]]
name = "topological_order"
weight = 0.45
verifier = "checks/check_topo_order.sh"
description = "Agent orders babel before next.js, gated on having derived the graph from the manifests rather than assumed the toolchain's chain"
timeout_seconds = 60

[[checkpoints]]
name = "parallelism"
weight = 0.30
verifier = "checks/check_parallelism.sh"
description = "Agent scopes webpack out of the change (evidenced by acorn), leaving no parallelizable steps"
timeout_seconds = 60

[artifacts]
required = ["answer", "topological_order"]
optional = ["migration_guide"]

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "3-repo JS build chain requires cross-repo package.json analysis and understanding how Babel AST changes propagate through webpack loaders to Next.js build config"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "packages/babel-parser/package.json"
repo = "babel"
confidence = 0.95
source = "deterministic"

[[ground_truth.required_files]]
path = "package.json"
repo = "webpack"
confidence = 0.95
source = "deterministic"

[[ground_truth.required_files]]
path = "packages/next/package.json"
repo = "nextjs"
confidence = 0.95
source = "deterministic"
