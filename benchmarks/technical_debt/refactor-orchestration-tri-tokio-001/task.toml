# Refactor Orchestration: Async HTTP handler trait refactoring across tokio/hyper/axum

difficulty_stratum = "tri_repo"
mcp_suite = "eb_v1"
repo_set_id = "rust-async-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "refactor-orchestration-tri-tokio-001"
suite = "technical_debt"
task_type = "refactor_orchestration"
difficulty = "hard"
estimated_duration_minutes = 35
session_type = "single"
description = "Plan the rollout of a tokio Runtime builder change across three vendored repos whose real dependency graph must be derived from the manifests"
# NEVER SHOWN TO THE AGENT. run_task.py feeds instruction.md
# (`agent_command < /workspace/instruction.md`); this field is stale
# CSB-migration metadata. Re-synced anyway: its previous text stated
# "The dependency chain is: tokio -> hyper -> axum" and asserted that the change
# breaks "axum's Server::bind which depends on hyper's server builder" — both the
# giveaway this rebuild removed and false at the pinned revs (axum 0.6.19 wants
# hyper ^0.14.24; the workspace vendors 1.0.0-rc.4). Left as it was, a future
# regeneration of instruction.md from this field would restore the leak and the
# false premise together.
prompt = """
As tech lead for a Rust microservices platform, you need to plan the rollout of
a breaking change in the async HTTP stack. tokio is refactoring its runtime
builder API to support configurable task schedulers: Runtime::new() is gaining a
required scheduler configuration parameter. This breaks any crate that builds a
tokio runtime or spawns onto one.

We vendor three repos at /workspace/tokio/, /workspace/hyper/ and
/workspace/axum/. Do not assume how they relate to each other. Derive every
dependency edge from the manifests as they are checked out in this workspace,
and cite the version requirement that establishes each one.

Your task is to produce a topologically sorted execution plan:

1. Identify all repos requiring changes and in what order.
2. Map the dependency relationships between repos, citing the manifest and
   version requirement behind each edge. If a dependency you expected is not
   present at these revisions, say so and show what the manifest requires.
3. Produce a numbered, ordered list of repos to update.
4. Identify any steps that can be done in parallel, and why.
5. Note which changes are breaking vs. compatible.

Write your plan to /workspace/REFACTOR_PLAN.md with:
- Numbered ordering of repos to update
- Dependency graph explanation
- Parallelization annotations
- Risk assessment and breaking change annotations
"""

[[repos]]
url = "https://github.com/tokio-rs/tokio"
rev = "tokio-1.29.1"
path = "tokio"
role = "upstream"

[[repos]]
url = "https://github.com/hyperium/hyper"
rev = "v1.0.0-rc.4"
path = "hyper"
role = "intermediary"

[[repos]]
url = "https://github.com/tokio-rs/axum"
rev = "axum-v0.6.19"
path = "axum"
role = "consumer"

[metadata]
languages = ["rust"]
total_loc = 320000
dependency_depth = 3
frameworks = ["tokio", "hyper", "axum"]
multi_repo_pattern = "orchestrate"

# Weights unchanged; every checkpoint re-scoped onto manifest-derived evidence.
# All three previously graded vocabulary instruction.md supplied, so a plan that
# restated the prompt scored a perfect 1.0000 with zero repo access while a
# correct manifest-derived plan scored 0.6500 and an empty file scored 0.15.
# See each check's header and ground_truth.json:_premise_correction — the
# tokio -> hyper -> axum chain the task asserted does not exist at these revs.
[[checkpoints]]
name = "identify_repos"
weight = 0.25
verifier = "checks/check_repo_set.sh"
description = "Agent names the three repos AND cites the manifest requirement that puts axum in scope directly (tokio 1.25.0), not via hyper"
timeout_seconds = 30

[[checkpoints]]
name = "topological_order"
weight = 0.45
verifier = "checks/check_topo_order.sh"
description = "Agent produces a valid ordering of the real fan-out graph, gated on having derived it from the manifests rather than assumed the ecosystem's chain"
timeout_seconds = 60

[[checkpoints]]
name = "parallelism"
weight = 0.30
verifier = "checks/check_parallelism.sh"
description = "Agent identifies hyper and axum as independently updatable, evidenced by axum's real hyper requirement"
timeout_seconds = 60

[artifacts]
required = ["answer", "topological_order"]
optional = ["migration_guide"]

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "3-repo Rust dependency chain requires cross-repo Cargo.toml analysis and trait compatibility checking across tokio/hyper/axum"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "tokio/Cargo.toml"
repo = "tokio"
confidence = 0.95
source = "deterministic"

[[ground_truth.required_files]]
path = "Cargo.toml"
repo = "hyper"
confidence = 0.95
source = "deterministic"

[[ground_truth.required_files]]
path = "axum/Cargo.toml"
repo = "axum"
confidence = 0.95
source = "deterministic"
