# Refactor Orchestration: Go 1.26 + distroless image update cascade in Kubernetes

difficulty_stratum = "monorepo_cross_package"
mcp_suite = "eb_v1"
repo_set_id = "kubernetes-ecosystem"
org_scale = true
verification_modes = ["deterministic"]

[task]
id = "refactor-orch-006"
suite = "technical_debt"
task_type = "refactor_orchestration"
difficulty = "hard"
estimated_duration_minutes = 40
session_type = "single"
description = "Plan the ordering for Go 1.26 toolchain and distroless image update across Kubernetes staging repos"
# NEVER SHOWN TO THE AGENT. run_task.py feeds instruction.md
# (`agent_command < /workspace/instruction.md`); this field is stale
# CSB-migration metadata. Re-synced anyway: its previous text stated the giveaway
# outright -- "The staging repos have inter-dependencies (e.g., client-go depends
# on apimachinery, api depends on apimachinery). The Go version bump must
# propagate in dependency order" -- and that is false for this change. A Go
# toolchain bump touches NO file under staging/src/ (PR #137080 changed seven
# files, none of them staging); the 31 published staging repos take their Go
# version from one line, staging/publishing/rules.yaml:default-go-version. Left
# as it was, a future regeneration of instruction.md from this field would
# restore the leak and the false premise together.
prompt = """
As the release manager for the next Kubernetes minor version, you need to
coordinate the Go toolchain bump to 1.26.0 from whatever the checkout currently
pins.

Our release notes claim the bump cascades through the staging repository
ecosystem: that each staging repo carries its own Go version and must be updated
in dependency order (client-go depends on apimachinery, api depends on
apimachinery, apiserver depends on client-go), alongside the build
infrastructure, the distroless base images and the E2E test infrastructure.

Do not take that as given. Work out from the checkout which files a Go toolchain
bump actually has to change, and what governs that set. Cite the file and the
entry that establishes each edge. If something the notes call affected turns out
not to be, say so and show what the checkout actually declares.

Your task is to produce an ordered execution plan:

1. Work out which files a Go toolchain bump has to change, and what governs them.
2. Determine the order the steps must land in.
3. Produce a numbered, ordered list of files to update, by repo-relative path.
4. Identify any steps that can proceed at the same time, and why.

Write your plan to /workspace/REFACTOR_PLAN.md with:
- Numbered ordering of files to update
- The dependency graph over those files, citing the entry behind each edge
- Parallelization annotations
- Risk assessment per step
"""

[[repos]]
url = "https://github.com/kubernetes/kubernetes"
rev = "v1.34.0"
path = "kubernetes"
role = "primary"

[metadata]
languages = ["go"]
total_loc = 4200000
dependency_depth = 4
frameworks = ["kubernetes"]
multi_repo_pattern = "orchestrate"

[[checkpoints]]
name = "identify_repos"
weight = 0.25
verifier = "checks/check_repo_set.sh"
description = "Agent identifies key staging repos and infrastructure components"
timeout_seconds = 30

[[checkpoints]]
name = "topological_order"
weight = 0.45
verifier = "checks/check_topo_order.sh"
description = "Agent produces valid topological ordering"
timeout_seconds = 60

[[checkpoints]]
name = "parallelism"
weight = 0.30
verifier = "checks/check_parallelism.sh"
description = "Agent correctly identifies parallelizable steps"
timeout_seconds = 60

[artifacts]
required = ["answer", "topological_order"]
optional = ["migration_guide"]

[tool_access]
sourcegraph_mirror_config = "configs/sg_mirrors/refactor-orch-006.json"
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Kubernetes staging repo dependency graph is complex; requires go.mod analysis across 20+ staging repos"

[ground_truth]
tiers = ["deterministic"]

# build/dependencies.yaml is where the real propagation set is declared (a
# `version` plus a `refPaths` list per entry). staging/src/k8s.io/client-go/go.mod
# is required reading precisely because it is NOT affected: it is where the
# release notes' staging-cascade claim is refuted (it declares `go 1.24.0`, the
# language version, which a toolchain bump does not touch). See
# ground_truth.json:_premise_correction.
[[ground_truth.required_files]]
path = "build/dependencies.yaml"
repo = "kubernetes"
confidence = 0.98
source = "deterministic"

[[ground_truth.required_files]]
path = ".go-version"
repo = "kubernetes"
confidence = 0.95
source = "deterministic"

[[ground_truth.required_files]]
path = "staging/publishing/rules.yaml"
repo = "kubernetes"
confidence = 0.95
source = "deterministic"

[[ground_truth.required_files]]
path = "staging/src/k8s.io/client-go/go.mod"
repo = "kubernetes"
confidence = 0.90
source = "deterministic"
