# error_provenance: Trace tokio task panic propagation through tower service lay

difficulty_stratum = "dual_repo"
mcp_suite = "eb_v1"
repo_set_id = "rust-async-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "error-prov-dual-tokio-tower-001"
suite = "customer_escalation"
task_type = "error_provenance"
difficulty = "expert"
estimated_duration_minutes = 50
session_type = "single"
description = "Trace tokio task panic propagation through tower service layers"
prompt = """
A production gRPC service is panicking inside a tokio::spawn'd task
within a tower service layer. The panic message surfaces as a generic
"task panicked" error, losing the original context.

Your task:
1. Find how tokio handles panics in spawned tasks (JoinError, panic hook)
2. Find how tower Service layers propagate errors from inner services
3. Trace the error path from a tokio task panic through tower layers
4. Identify where error context is lost and document a fix

Write your analysis to /workspace/analysis/IMPACT_REPORT.md
"""

[[repos]]
url = "https://github.com/tokio-rs/tokio"
rev = "tokio-1.35.0"
path = "tokio"
role = "dependency"

[[repos]]
url = "https://github.com/tower-rs/tower"
rev = "tower-0.4.13"
path = "tower"
role = "primary"

[metadata]
languages = ["rust"]
total_loc = 200_000
dependency_depth = 2
frameworks = ["tokio", "tower"]
multi_repo_pattern = "investigate"

[[checkpoints]]
name = "tokio_panic_handling"
weight = 0.30
verifier = "checks/check_tokio_panic_handling.sh"
description = "Agent identifies tokio panic propagation"
timeout_seconds = 120

[[checkpoints]]
name = "tower_error_chain"
weight = 0.40
verifier = "checks/check_tower_error_chain.sh"
description = "Agent traces tower error propagation"
timeout_seconds = 120

[[checkpoints]]
name = "context_loss"
weight = 0.30
verifier = "checks/check_context_loss.sh"
description = "Agent identifies where error context is lost"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = ["migration_guide"]

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Error type tracing across repos requires deep cross-crate search"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "tokio/tokio/src/task/join.rs"
repo = "tokio"
confidence = 0.9
source = "deterministic"

[[ground_truth.required_files]]
path = "tower/tower/src/util/mod.rs"
repo = "tower"
confidence = 0.85
source = "deterministic"

[[ground_truth.sufficient_files]]
path = "tokio/tokio/src/runtime/task/error.rs"
repo = "tokio"
confidence = 0.8

[[ground_truth.sufficient_files]]
path = "tower/tower/src/buffer/service.rs"
repo = "tower"
confidence = 0.8
