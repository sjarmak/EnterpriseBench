# error_provenance: Trace Netty channel pipeline error propagation through Sprin

difficulty_stratum = "dual_repo"
mcp_suite = "eb_v1"
repo_set_id = "java-enterprise-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "error-prov-dual-netty-spring-001"
suite = "customer_escalation"
task_type = "error_provenance"
difficulty = "expert"
estimated_duration_minutes = 50
session_type = "single"
description = "Trace Netty channel pipeline error propagation through Spring WebFlux reactive stack"
prompt = """
A Spring WebFlux application is experiencing intermittent connection
reset errors. The errors originate in Netty's channel pipeline but
surface as generic 500 errors in Spring WebFlux.

Your task:
1. Find how Netty handles channel pipeline exceptions (exceptionCaught)
2. Find how Spring WebFlux wraps Netty's reactor-netty in its server
3. Trace an exception from Netty's channel handler through reactor-netty
   into Spring WebFlux's error handling
4. Identify where error context is lost in the translation

Write your analysis to /workspace/analysis/IMPACT_REPORT.md
"""

[[repos]]
url = "https://github.com/netty/netty"
rev = "netty-4.1.100.Final"
path = "netty"
role = "dependency"

[[repos]]
url = "https://github.com/spring-projects/spring-framework"
rev = "v6.0.11"
path = "spring-framework"
role = "primary"

[metadata]
languages = ["java"]
total_loc = 200_000
dependency_depth = 2
frameworks = ["netty", "spring-webflux", "reactor"]
multi_repo_pattern = "investigate"

[[checkpoints]]
name = "netty_error_handling"
weight = 0.30
verifier = "checks/check_netty_error_handling.sh"
description = "Agent identifies Netty exception propagation"
timeout_seconds = 120

[[checkpoints]]
name = "spring_webflux_bridge"
weight = 0.40
verifier = "checks/check_spring_webflux_bridge.sh"
description = "Agent traces Spring WebFlux → Netty bridge"
timeout_seconds = 120

[[checkpoints]]
name = "error_context_loss"
weight = 0.30
verifier = "checks/check_error_context_loss.sh"
description = "Agent identifies where context is lost"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = ["migration_guide"]

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Error chain tracing across Netty, reactor-netty, and Spring requires deep search"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "netty/handler/src/main/java/io/netty/handler/codec/http/HttpServerCodec.java"
repo = "netty"
confidence = 0.85
source = "deterministic"

[[ground_truth.required_files]]
path = "spring-framework/spring-web/src/main/java/org/springframework/http/server/reactive/ReactorHttpHandlerAdapter.java"
repo = "spring-framework"
confidence = 0.9
source = "deterministic"

[[ground_truth.sufficient_files]]
path = "netty/transport/src/main/java/io/netty/channel/DefaultChannelPipeline.java"
repo = "netty"
confidence = 0.8
