# dependency_graph: Trace urllib3 2.0 upgrade cascade through requests and botoc

difficulty_stratum = "tri_repo"
mcp_suite = "eb_v1"
repo_set_id = "python-packaging-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "dep-graph-tri-boto3-urllib3-requests-001"
suite = "dependency_management"
task_type = "dependency_graph"
difficulty = "expert"
estimated_duration_minutes = 55
session_type = "single"
description = "Trace urllib3 2.0 upgrade cascade through requests and botocore/boto3"
prompt = """
urllib3 2.0 was a major release that affected the entire Python HTTP
stack. Both requests and botocore depend on urllib3 with conflicting
version constraints. botocore vendors its own urllib3 copy.

Your task:
1. Map the dependency chain: boto3/botocore → urllib3, requests → urllib3
2. Find version pin conflicts between botocore and requests for urllib3
3. Identify where botocore's vendored urllib3 diverges from upstream 2.0
4. Document the upgrade coordination challenge across all three repos

Write your analysis to /workspace/analysis/IMPACT_REPORT.md
"""

[[repos]]
url = "https://github.com/urllib3/urllib3"
rev = "2.0.0"
path = "urllib3"
role = "dependency"

[[repos]]
url = "https://github.com/psf/requests"
rev = "v2.31.0"
path = "requests"
role = "intermediary"

[[repos]]
url = "https://github.com/boto/botocore"
rev = "1.31.0"
path = "botocore"
role = "primary"

[metadata]
languages = ["python"]
total_loc = 200_000
dependency_depth = 3
frameworks = ["urllib3", "requests", "botocore"]
multi_repo_pattern = "propagate"

[[checkpoints]]
name = "dep_chain_map"
weight = 0.30
verifier = "checks/check_dep_chain_map.sh"
description = "Agent maps three-repo dependency chain"
timeout_seconds = 120

[[checkpoints]]
name = "version_conflicts"
weight = 0.35
verifier = "checks/check_version_conflicts.sh"
description = "Agent identifies version pin conflicts"
timeout_seconds = 120

[[checkpoints]]
name = "upgrade_strategy"
weight = 0.35
verifier = "checks/check_upgrade_strategy.sh"
description = "Agent documents upgrade coordination"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = ["migration_guide"]

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Three-repo version constraint analysis requires extensive cross-repo search"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "urllib3/CHANGES.rst"
repo = "urllib3"
confidence = 0.85
source = "deterministic"

[[ground_truth.required_files]]
path = "requests/setup.cfg"
repo = "requests"
confidence = 0.9
source = "deterministic"

[[ground_truth.required_files]]
path = "botocore/setup.py"
repo = "botocore"
confidence = 0.9
source = "deterministic"

[[ground_truth.sufficient_files]]
path = "botocore/botocore/httpsession.py"
repo = "botocore"
confidence = 0.85

[[ground_truth.sufficient_files]]
path = "requests/requests/adapters.py"
repo = "requests"
confidence = 0.8
