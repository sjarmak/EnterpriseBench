# dependency_graph: Trace Hibernate 6 SessionFactory changes affecting Spring Da

difficulty_stratum = "dual_repo"
mcp_suite = "eb_v1"
repo_set_id = "java-enterprise-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "dep-graph-dual-spring-hibernate-001"
suite = "dependency_management"
task_type = "dependency_graph"
difficulty = "hard"
estimated_duration_minutes = 40
session_type = "single"
description = "Trace Hibernate 6 SessionFactory changes affecting Spring Data JPA auto-config"
prompt = """
Hibernate 6 restructured the SessionFactory and removed several
deprecated configuration properties. Spring Data JPA relies on
Hibernate as its default JPA provider.

Your task:
1. Find where Hibernate 6 changed SessionFactory configuration API
2. Find where Spring Data JPA configures the Hibernate SessionFactory
3. Map the dependency chain from Spring Boot auto-config to Hibernate
4. Document deprecated configuration properties and their replacements

Write your analysis to /workspace/analysis/IMPACT_REPORT.md
"""

[[repos]]
url = "https://github.com/hibernate/hibernate-orm"
rev = "6.2.0"
path = "hibernate-orm"
role = "dependency"

[[repos]]
url = "https://github.com/spring-projects/spring-boot"
rev = "v3.1.0"
path = "spring-boot"
role = "primary"

[metadata]
languages = ["java"]
total_loc = 200_000
dependency_depth = 2
frameworks = ["hibernate", "spring-boot", "spring-data-jpa"]
multi_repo_pattern = "propagate"

[[checkpoints]]
name = "hibernate_changes"
weight = 0.30
verifier = "checks/check_hibernate_changes.sh"
description = "Agent identifies Hibernate 6 SessionFactory changes"
timeout_seconds = 120

[[checkpoints]]
name = "spring_jpa_config"
weight = 0.40
verifier = "checks/check_spring_jpa_config.sh"
description = "Agent finds Spring JPA auto-configuration"
timeout_seconds = 120

[[checkpoints]]
name = "migration_path"
weight = 0.30
verifier = "checks/check_migration_path.sh"
description = "Agent documents property migrations"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = ["migration_guide"]

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Spring Boot's massive codebase benefits from targeted cross-repo search"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "hibernate-orm/hibernate-core/src/main/java/org/hibernate/cfg/Configuration.java"
repo = "hibernate-orm"
confidence = 0.9
source = "deterministic"

[[ground_truth.required_files]]
path = "spring-boot/spring-boot-project/spring-boot-autoconfigure/src/main/java/org/springframework/boot/autoconfigure/orm/jpa/HibernateJpaAutoConfiguration.java"
repo = "spring-boot"
confidence = 0.9
source = "deterministic"

[[ground_truth.sufficient_files]]
path = "hibernate-orm/hibernate-core/src/main/java/org/hibernate/cfg/AvailableSettings.java"
repo = "hibernate-orm"
confidence = 0.85
