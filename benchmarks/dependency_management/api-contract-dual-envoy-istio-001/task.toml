# api_contract: Trace Envoy xDS API v3 changes affecting Istio's control pla

difficulty_stratum = "dual_repo"
mcp_suite = "eb_v1"
repo_set_id = "cncf-observability-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "api-contract-dual-envoy-istio-001"
suite = "dependency_management"
task_type = "api_contract"
difficulty = "expert"
estimated_duration_minutes = 55
session_type = "single"
description = "Trace Envoy xDS API v3 changes affecting Istio's control plane configuration"
prompt = """
Envoy's xDS (discovery service) API evolved from v2 to v3, changing
resource type names and proto message structures. Istio's control
plane (istiod) generates xDS configuration for Envoy sidecars.

Your task:
1. Find where Envoy defines xDS v3 API proto messages
2. Find where Istio generates xDS configuration for Envoy
3. Identify v2 → v3 API changes in cluster, listener, and route configs
4. Document the contract points between Istio's xDS generator and
   Envoy's xDS consumer

Write your analysis to /workspace/analysis/IMPACT_REPORT.md
"""

[[repos]]
url = "https://github.com/envoyproxy/envoy"
rev = "v1.28.0"
path = "envoy"
role = "dependency"

[[repos]]
url = "https://github.com/istio/istio"
rev = "1.20.0"
path = "istio"
role = "primary"

[metadata]
languages = ["go", "cpp"]
total_loc = 200_000
dependency_depth = 2
frameworks = ["envoy", "istio"]
multi_repo_pattern = "enforce"

[[checkpoints]]
name = "envoy_xds_api"
weight = 0.30
verifier = "checks/check_envoy_xds_api.sh"
description = "Agent identifies Envoy xDS v3 proto definitions"
timeout_seconds = 120

[[checkpoints]]
name = "istio_xds_gen"
weight = 0.40
verifier = "checks/check_istio_xds_gen.sh"
description = "Agent finds Istio's xDS configuration generation"
timeout_seconds = 120

[[checkpoints]]
name = "v2_v3_drift"
weight = 0.30
verifier = "checks/check_v2_v3_drift.sh"
description = "Agent documents v2→v3 contract changes"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = ["migration_guide"]

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Proto API tracing across envoy and istio's large codebases needs code search"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "envoy/api/envoy/config/cluster/v3/cluster.proto"
repo = "envoy"
confidence = 0.9
source = "deterministic"

[[ground_truth.required_files]]
path = "istio/pilot/pkg/xds/ads.go"
repo = "istio"
confidence = 0.9
source = "deterministic"

[[ground_truth.sufficient_files]]
path = "istio/pilot/pkg/model/push_context.go"
repo = "istio"
confidence = 0.85

[[ground_truth.sufficient_files]]
path = "envoy/api/envoy/config/listener/v3/listener.proto"
repo = "envoy"
confidence = 0.8
