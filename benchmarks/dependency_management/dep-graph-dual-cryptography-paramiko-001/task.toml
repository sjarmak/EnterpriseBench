# dependency_graph: Trace cryptography 41.0 OpenSSL changes breaking paramiko SS

difficulty_stratum = "dual_repo"
mcp_suite = "eb_v1"
repo_set_id = "python-packaging-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "dep-graph-dual-cryptography-paramiko-001"
suite = "dependency_management"
task_type = "dependency_graph"
difficulty = "hard"
estimated_duration_minutes = 35
session_type = "single"
description = "Trace cryptography 41.0 OpenSSL changes breaking paramiko SSH transport"
prompt = """
The cryptography library v41.0 dropped support for OpenSSL 1.1.1 and
removed the deprecated `default_backend()` parameter. Paramiko uses
cryptography for SSH key exchange and transport encryption.

Your task:
1. Find where cryptography removed default_backend() and changed cipher APIs
2. Find where paramiko calls cryptography APIs for key exchange and encryption
3. Trace the impact through paramiko's transport and kex modules
4. Document which paramiko functions need updating

Write your analysis to /workspace/analysis/IMPACT_REPORT.md
"""

[[repos]]
url = "https://github.com/pyca/cryptography"
rev = "41.0.0"
path = "cryptography"
role = "dependency"

[[repos]]
url = "https://github.com/paramiko/paramiko"
rev = "3.2.0"
path = "paramiko"
role = "primary"

[metadata]
languages = ["python"]
total_loc = 200_000
dependency_depth = 2
frameworks = ["cryptography", "paramiko"]
multi_repo_pattern = "propagate"

[[checkpoints]]
name = "crypto_api_changes"
weight = 0.30
verifier = "checks/check_crypto_api_changes.sh"
description = "Agent identifies cryptography API removals"
timeout_seconds = 120

[[checkpoints]]
name = "paramiko_crypto_usage"
weight = 0.40
verifier = "checks/check_paramiko_crypto_usage.sh"
description = "Agent finds paramiko's cryptography usage"
timeout_seconds = 120

[[checkpoints]]
name = "impact_scope"
weight = 0.30
verifier = "checks/check_impact_scope.sh"
description = "Agent documents full impact scope"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = ["migration_guide"]

[tool_access]
expected_mcp_benefit = "medium"
mcp_benefit_rationale = "Tracing backend= parameter removal across crypto API surface"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "cryptography/src/cryptography/hazmat/backends/__init__.py"
repo = "cryptography"
confidence = 0.9
source = "deterministic"

[[ground_truth.required_files]]
path = "paramiko/paramiko/transport.py"
repo = "paramiko"
confidence = 0.9
source = "deterministic"

[[ground_truth.sufficient_files]]
path = "paramiko/paramiko/kex_group1.py"
repo = "paramiko"
confidence = 0.85

[[ground_truth.sufficient_files]]
path = "cryptography/src/cryptography/hazmat/primitives/ciphers/base.py"
repo = "cryptography"
confidence = 0.8
