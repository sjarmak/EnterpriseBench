# Config Drift: Spring Cloud Dataflow external RabbitMQ configuration inconsistencies

difficulty_stratum = "large_single"
mcp_suite = "eb_v1"
repo_set_id = "helm-ecosystem"
org_scale = true
verification_modes = ["deterministic"]

[task]
id = "config-drift-scdf-rabbitmq-002"
suite = "platform_engineering"
task_type = "config_drift"
difficulty = "hard"
estimated_duration_minutes = 25
session_type = "single"
description = "Identify configuration drift in Spring Cloud Dataflow's external RabbitMQ config across values, helpers, secrets, and configmaps"
prompt = """
The bitnami/spring-cloud-dataflow Helm chart supports connecting to an external
RabbitMQ server instead of deploying the bundled RabbitMQ subchart. However, users
are reporting that the external RabbitMQ configuration path is broken — secrets
don't work with existing secrets, and some required parameters are missing.

Your task:
1. Trace the external RabbitMQ configuration flow through the chart hierarchy:
   - values.yaml (externalRabbitmq.* parameters)
   - templates/_helpers.tpl (RabbitMQ connection helpers)
   - templates/externalrabbitmq-secrets.yaml (secret generation)
   - templates/skipper/configmap.yaml (Skipper service config)
2. Identify all configuration drift points where values are defined inconsistently,
   missing, or incorrectly referenced across these layers.
3. Compare the external RabbitMQ config path against the external database config
   path for consistency gaps.
4. For each drift point, specify file, key, expected value, actual value, and the
   override chain.

Write your analysis to /workspace/charts/DRIFT_REPORT.json with the following
structure:
{
  "drift_points": [
    {
      "file": "<file path>",
      "key": "<config key>",
      "expected": "<what should be>",
      "actual": "<what is>",
      "override_chain": ["layer1 -> layer2 -> ..."]
    }
  ]
}
"""

[[repos]]
url = "https://github.com/bitnami/charts"
rev = "53aca51120f86086e6780dc0453b93fbf49766b4"
path = "charts"
role = "primary"

[metadata]
languages = ["yaml", "go-template"]
total_loc = 2_000_000
dependency_depth = 2
frameworks = ["helm", "kubernetes", "spring-cloud"]
multi_repo_pattern = "enforce"

# validate_corrected_config (0.25, checks/check_config_valid.sh) removed, not
# repaired: instruction.md asks only for DRIFT_REPORT.json, so it graded an
# artifact a compliant agent has no reason to produce and paid 1.0 for its
# absence. Weight redistributed in the original 0.40:0.35 ratio (schema requires
# the sum to be 1.0). determine_expected_values becomes config_hierarchy: the
# instruction's first ask is the hierarchy trace, and the "expected value" for
# every drift point here is a design shape rather than a literal, so grading a
# free-text expected string measured nothing.
[[checkpoints]]
name = "identify_drift_points"
weight = 0.55
verifier = "checks/check_drift_points.sh"
description = "Agent finds the real drift points, including the NOTES.txt validation the prompt misdirects away from"
timeout_seconds = 60

[[checkpoints]]
name = "config_hierarchy"
weight = 0.45
verifier = "checks/check_config_hierarchy.sh"
description = "Agent's trace reaches the layers that actually carry the drift: NOTES.txt, the hardcoded rabbitmq-password key, and the scdf.rabbitmq.fullname secret-name resolution"
timeout_seconds = 60

[artifacts]
required = ["answer"]

[tool_access]
sourcegraph_mirror_config = "configs/sg_mirrors/config-drift-scdf-rabbitmq-002.json"
expected_mcp_benefit = "medium"
mcp_benefit_rationale = "Tracing external RabbitMQ config flow through a 4-layer Helm hierarchy (values.yaml → helpers → secrets → configmaps) benefits from MCP, though template variable names are searchable across chart files"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "bitnami/spring-cloud-dataflow/values.yaml"
repo = "charts"
confidence = 0.98
source = "deterministic"

[[ground_truth.required_files]]
path = "bitnami/spring-cloud-dataflow/templates/_helpers.tpl"
repo = "charts"
confidence = 0.98
source = "deterministic"

[[ground_truth.required_files]]
path = "bitnami/spring-cloud-dataflow/templates/externalrabbitmq-secrets.yaml"
repo = "charts"
confidence = 0.95
source = "deterministic"

[[ground_truth.required_files]]
path = "bitnami/spring-cloud-dataflow/templates/skipper/configmap.yaml"
repo = "charts"
confidence = 0.90
source = "deterministic"

# Promoted from sufficient_files (0.60). NOTES.txt:77 and :85-88 hold the
# scdf.rabbitmq.fullname secret-name resolution and the rabbitmq.auth.password /
# rabbitmq.auth.erlangCookie validation — two of the four drift points and the
# only place either string exists. The weighting was inverted: _helpers.tpl sat
# at required/0.98 while containing 0 hits for both, because the old answer key
# attributed the validation there. PR #24493 changes NOTES.txt (+13/-9), its
# largest template hunk.
[[ground_truth.required_files]]
path = "bitnami/spring-cloud-dataflow/templates/NOTES.txt"
repo = "charts"
confidence = 0.95
source = "deterministic"

[[ground_truth.sufficient_files]]
path = "bitnami/spring-cloud-dataflow/Chart.yaml"
repo = "charts"
confidence = 0.70
