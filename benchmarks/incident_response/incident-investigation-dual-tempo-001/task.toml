[artifacts]
required = ["incident_report"]
optional = ["code_patch"]

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "The bug spans two Go modules where the failure surface (Tempo ingester saturation) is several call hops away from the root cause (dskit ring health-check semantics). Cross-repo navigation through go.mod into a less-famous infrastructure library (dskit) and back into Tempo's distributor/ingester paths is exactly what Sourcegraph cross-repo search and call-graph navigation accelerate; LLMs are unlikely to memorize dskit internals."

