[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eb-verify"
version = "0.2.0"
description = "EnterpriseBench verification library"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# Fact-coverage scoring imports numpy/scikit-learn lazily and degrades to a clean
# ScoringDepsUnavailable without them. These must stay optional: a numpy-less
# install is the canonical one, and tests/integrity/test_plugin_registration_deps.py
# pins that contract. Do not promote them into [project] dependencies.
scoring = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]
dev = [
    "eb-verify[scoring]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # scripts/generate_charts.py, covered by tests/test_generate_charts.py.
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.scripts]
eb-verify = "eb_verify.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
