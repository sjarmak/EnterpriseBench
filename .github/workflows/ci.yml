name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        # The [dev] extra pulls the test suite's full dependency set (pytest,
        # scoring stack, chart stack). Installing the deps by name here instead
        # is what let numpy/matplotlib go undeclared and abort collection.
        run: pip install -e "lib/[dev]"
      - name: Run tests
        run: python3 -m pytest tests/ -v --tb=short -m "not network and not docker"
      - name: Scoring-integrity corpus (merge blocker)
        # Explicit, un-skippable gate for the scorer trust boundary: one
        # adversarial vector per known score-corruption class (over-credit
        # forgery + under-credit false-zero). Named separately so a future
        # marker-filter change on the step above can never silently drop it.
        run: python3 -m pytest tests/integrity/ -v --tb=short
      - name: Audit task consistency
        run: python3 scripts/audit_consistency.py
      - name: Validate shell scripts
        run: |
          find benchmarks -name "*.sh" -not -path "*/_archived/*" | while read f; do
            bash -n "$f" || exit 1
          done
